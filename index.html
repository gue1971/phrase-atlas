<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>古今こだま集</title>
    <link rel="stylesheet" href="./style.css?v=20260514-related" />
  </head>
  <body>
    <header class="top-bar">
      <div class="view-toggle" aria-label="表示切替">
        <button id="tocViewButton" class="toggle-button active" type="button" aria-label="目次表示">
          <span class="toggle-icon list-icon" aria-hidden="true"></span>
        </button>
        <button id="cardViewButton" class="toggle-button" type="button" aria-label="カード表示">
          <span class="toggle-icon grid-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="header-title" aria-hidden="true">古今こだま集</div>
      <div class="header-actions">
        <button id="randomButton" class="icon-button random-button" type="button" aria-label="一枚引く">
          <span class="random-icon" aria-hidden="true"></span>
        </button>
        <button id="openFilterButton" class="icon-button" type="button" aria-label="検索条件を開く">☰</button>
      </div>
    </header>

    <div class="app-shell">
      <main>
        <section id="tocList" class="toc-list" aria-label="目次一覧"></section>
        <section id="cardList" class="card-list" aria-label="フレーズカード一覧"></section>
        <p id="emptyState" class="empty-state" hidden>条件に合うカードがありません。</p>
      </main>
    </div>

    <div id="filterOverlay" class="filter-overlay" hidden>
      <section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
        <div class="filter-panel-head">
          <h2 id="filterTitle">検索条件</h2>
          <button id="closeFilterButton" class="icon-button" type="button" aria-label="検索条件を閉じる">×</button>
        </div>

        <div class="controls" aria-label="検索と絞り込み">
          <label class="search-field">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="言葉、人物、著作、タグで検索" autocomplete="off" />
          </label>

          <div class="filter-grid">
            <label>
              <span>カテゴリ</span>
              <select id="categoryFilter"></select>
            </label>
            <label>
              <span>進捗</span>
              <select id="knowledgeFilter"></select>
            </label>
            <label>
              <span>並び替え</span>
              <select id="sortSelect">
                <option value="fame">有名度順</option>
                <option value="year">年代順</option>
                <option value="person">人物名順</option>
              </select>
            </label>
          </div>

          <div class="control-actions">
            <button id="resetButton" class="ghost-button" type="button">条件をリセット</button>
          </div>
        </div>
      </section>
    </div>

    <div id="detailOverlay" class="detail-overlay" hidden>
      <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div id="detailContent"></div>
      </article>
    </div>

    <script src="./phrases.js?v=20260514-400"></script>
    <script src="./app.js?v=20260514-random"></script>
  </body>
</html>
