<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ことばカルテ" />
    <title>ことばカルテ</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css?v=20260517-detail-footer" />
  </head>
  <body>
    <header class="top-bar">
      <div id="headerTitle" class="header-title" aria-hidden="true">ことばカルテ</div>
    </header>

    <footer class="bottom-bar" aria-label="画面操作">
      <div id="footerLeft" class="footer-actions footer-left"></div>
      <div id="footerCenter" class="footer-center" hidden></div>
      <div id="footerRight" class="footer-actions footer-right"></div>

      <div id="footerControls" hidden>
        <button id="returnDetailButton" class="icon-button nav-icon-button return-detail-button" type="button" aria-label="最後のカルテへ戻る" hidden>
          <span class="toggle-icon return-icon" aria-hidden="true"></span>
        </button>
        <button id="viewToggleButton" class="icon-button nav-icon-button" type="button" aria-label="リスト表示へ">
          <span id="viewToggleIcon" class="toggle-icon list-icon" aria-hidden="true"></span>
        </button>
        <button id="bookmarkToggleButton" class="icon-button bookmark-toggle-button" type="button" aria-label="ブックマークのみ表示" aria-pressed="false">
          <span class="bookmark-toggle-icon" aria-hidden="true">☆</span>
        </button>
        <button id="openFilterButton" class="icon-button" type="button" aria-label="検索条件を開く">
          <span class="search-icon" aria-hidden="true"></span>
        </button>
      </div>
    </footer>

    <div class="app-shell">
      <main>
        <section id="detailOverlay" class="detail-view" hidden>
          <article class="detail-panel" aria-labelledby="detailTitle">
            <div id="detailContent"></div>
          </article>
        </section>
        <section id="tocList" class="toc-list" aria-label="目次一覧"></section>
        <section id="cardList" class="card-list" aria-label="フレーズカード一覧"></section>
        <p id="emptyState" class="empty-state" hidden>条件に合うカードがありません。</p>
      </main>
    </div>

    <div id="filterOverlay" class="filter-overlay" hidden>
      <section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
        <div class="filter-panel-head">
          <h2 id="filterTitle">検索条件</h2>
        </div>

        <div class="controls" aria-label="検索と絞り込み">
          <label class="search-field">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="言葉、人物・由来、著作、タグで検索" autocomplete="off" />
          </label>

          <div class="filter-grid">
            <label>
              <span>カテゴリ</span>
              <select id="categoryFilter"></select>
            </label>
            <label>
              <span>進捗</span>
              <select id="knowledgeFilter"></select>
            </label>
          </div>

          <div class="control-actions">
            <button id="resetButton" class="ghost-button" type="button">条件をリセット</button>
            <button id="applyFilterButton" class="primary-button" type="button">表示する</button>
          </div>
        </div>
      </section>
    </div>

    <script src="./phrases.js?v=20260521-819"></script>
    <script src="./app.js?v=20260521-819"></script>
  </body>
</html>
